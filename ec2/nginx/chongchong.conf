server {
    listen 80;
    server_name _;   # 도메인이 있으면 여기에 적는다

    # 심볼릭 링크가 가리키는 최신 릴리스를 서빙한다
    root /var/www/chongchong/current;
    index index.html;

    # gzip (번들 용량이 크므로 켜두는 게 좋다)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # [1] API는 같은 도메인으로 받아서 스프링(8080)으로 넘긴다.
    #     → 프론트 입장에서 CORS 문제가 아예 발생하지 않는다.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [2] 해시가 붙은 정적 자산은 길게 캐시
    location ~* \.(js|css|woff2?|png|jpe?g|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # [3] SPA 라우팅: /studies/1 같은 주소로 새로고침해도 index.html을 준다.
    #     이게 없으면 react-router 경로에서 새로고침 시 404가 뜬다.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
