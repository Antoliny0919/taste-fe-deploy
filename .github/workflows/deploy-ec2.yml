name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 빌드는 EC2가 아니라 러너에서 한다.
      # (프리티어 t2.micro 1GB 램에서 webpack 빌드는 OOM으로 죽기 쉽다)
      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          DEPLOY_TARGET: ec2
          # nginx가 같은 도메인에서 /api 를 스프링으로 넘겨주므로 상대경로면 충분
          API_BASE: /api

      - name: Pack
        run: tar -czf dist.tar.gz -C frontend/dist .

      # 빌드 결과물만 EC2로 전송 (소스코드도, node_modules도 서버에 올리지 않는다)
      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist.tar.gz
          target: /tmp

      # 새 릴리스 디렉터리에 풀고 심볼릭 링크만 갈아끼운다 → 무중단 + 롤백 가능
      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            BASE=/var/www/chongchong
            RELEASE=$BASE/releases/$(date +%Y%m%d%H%M%S)
            mkdir -p $RELEASE
            tar -xzf /tmp/dist.tar.gz -C $RELEASE
            ln -sfn $RELEASE $BASE/current-tmp
            mv -Tf $BASE/current-tmp $BASE/current   # 원자적 교체
            ls -1dt $BASE/releases/* | tail -n +4 | xargs -r rm -rf  # 최근 3개만 보관
            rm -f /tmp/dist.tar.gz
