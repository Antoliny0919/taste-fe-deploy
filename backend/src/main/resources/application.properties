# 이 파일 외에는 건드릴 일이 없습니다.

# nginx가 이 포트로 프록시합니다. 바꾸지 마세요.
server.port=8080

# 화면에 표시될 라벨 (s3 / ec2 / local)
app.deploy-target=local

# CORS 허용 주소 목록 (쉼표로 구분)
# ▶ 버전 2(EC2 + nginx)만 쓴다면 이 줄은 무시해도 됩니다.
# ▶ 버전 1(S3)을 쓴다면 S3 웹사이트 주소를 여기에 넣으세요.
#    예) http://chongchong-frontend-poc.s3-website.ap-northeast-2.amazonaws.com
# 로컬 개발 서버(3005)는 기본으로 열어둡니다.
app.cors.allowed-origins=http://localhost:3005,http://127.0.0.1:3005

# 실행 로그를 간결하게
logging.level.org.springframework=WARN
